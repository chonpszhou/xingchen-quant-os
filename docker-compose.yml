name: xingchen-quant

services:
  xingchen:
    build: .
    image: xingchen-quant:latest
    container_name: xingchen-quant
    restart: unless-stopped
    environment:
      - TZ=Asia/Shanghai
      # Obsidian vault（仅挂载「量化交易」子目录，限制 blast radius）— cron 子进程仍需在 docker/crontab 顶部声明，
      # 因 cron 不继承此处 environment。挂载点命名为「量化交易」以便 learn 脚本智能解析 vault.name
      - OBSIDIAN_VAULT=/app/量化交易
    env_file:
      - path: .env
        required: false
    volumes:
      - ./data:/app/data          # 行情/财务/模拟盘状态（持久化）
      - ./docs:/app/docs          # 报告与摘要（宿主机可直接查看）
      - ./config:/app/config      # 配置可改（broker/push/tasks 等）
      - ./.env:/app/.env:ro       # 推送/券商凭证（可空）
      - ./logs:/var/log           # 运行日志
      - /Users/zhoupeng/Documents/Obsidian Vault/量化交易:/app/量化交易:rw   # 学习笔记同步真源（仅量化交易子目录）
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

  # 网页看板（访问 http://localhost:8080）
  xingchen-web:
    image: xingchen-quant:latest
    container_name: xingchen-quant-web
    restart: unless-stopped
    command: ["python3", "scripts/dashboard.py", "--host", "0.0.0.0", "--port", "8080"]
    ports:
      - "127.0.0.1:8080:8080"   # 仅本机可访问（操作台有执行权限，勿暴露公网）
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request,sys; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3); sys.exit(0)\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    volumes:
      - ./data:/app/data
      - ./docs:/app/docs
      - ./config:/app/config
      - ./.env:/app/.env:ro
