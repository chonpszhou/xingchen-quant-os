version: "1.0"
updated: "2026-08-11"

active: "paper"        # paper / qmt / futu / okx

paper:
  initial_cash: 1000000
  cost_rate: 0.001
  note: "可转债双低模拟盘，状态存 data/paper_cb_state.json"

qmt:
  enabled: false
  account: ""           # QMT 资金账号
  path: ""              # QMT 安装路径（userdata_mini 等）
